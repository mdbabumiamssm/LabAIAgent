  #       halt: "ABOR"
  #     limits:
  #       "write:value":
  #         value: {low: 4.0, high: 80.0, unit: degC}
  #     risk:
  #       "write:raw": critical

  # The plate reader with no API. Still automatable: the vendor software
  # exports a CSV, this driver ingests it, and downstream code cannot tell
  # the difference from a REST instrument.
  # - id: oldreader
